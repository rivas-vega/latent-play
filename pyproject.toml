[project]
name = "latent-play"
version = "0.1.0"
description = "A playable world model learned from action-free video: latent action model + JEPA dynamics + latent planning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "imageio>=2.31",
]

[project.optional-dependencies]
crafter = ["crafter>=1.8.3"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["latent_play"]

# Local development has no GPU: pull the (much smaller) CPU wheels of torch.
# On Kaggle/Colab, torch is preinstalled with CUDA; install there with `pip install -e .`.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
