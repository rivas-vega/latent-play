<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>latent-play · visual walkthrough</title>
<style>
:root{--bg:#fafafa;--ink:#15171a;--mut:#8b9099;--line:#d8dbe0;--ac:#0a66ff;--acs:rgba(10,102,255,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--ink:#eceef1;--mut:#7d838d;--line:#2a2e35;--ac:#4d8dff;--acs:rgba(77,141,255,.2)}}
:root[data-theme="dark"]{--bg:#101215;--ink:#eceef1;--mut:#7d838d;--line:#2a2e35;--ac:#4d8dff;--acs:rgba(77,141,255,.2)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#stage{position:absolute;left:50%;top:calc(50% - 18px);width:960px;height:540px;margin:-270px 0 0 -480px;transform-origin:center}
.sc{position:absolute;inset:0;opacity:0;transition:opacity .5s;pointer-events:none}.sc.act{opacity:1}
.ov{position:absolute;inset:0;width:960px;height:540px;overflow:visible}
.e{position:absolute;opacity:0;transition:opacity .6s ease,transform .6s ease;transform:translate(var(--x0,0),var(--y0,0))}
.e.on{opacity:1}.e.off{opacity:0}
.fr{border-radius:6px;border:1px solid var(--line);height:auto;display:block}
.t{font-size:15px;line-height:1.4;white-space:nowrap}.t small,.bx small{display:block;color:var(--mut);font-size:12px}
.c{left:0;width:960px;text-align:center}.cap{font-size:22px;font-weight:500;letter-spacing:-.01em}.mut{color:var(--mut)}.ac{color:var(--ac)}
.bx{border:1.5px solid var(--ink);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;background:var(--bg)}
.sl{border:1.5px solid var(--mut);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mut)}
.sl.lit{background:var(--ac);border-color:var(--ac);color:#fff}.sl.seen{background:var(--acs);border-color:var(--ac);color:var(--ac)}
.hl{border:2px solid var(--ac);border-radius:8px}
.gr{display:grid;grid-template-columns:repeat(6,11px);gap:2px}.gr i{width:11px;height:11px;border-radius:2px;background:color-mix(in srgb,var(--ink) var(--p),transparent)}.gr i.d{outline:1.5px solid var(--ac);outline-offset:1px}
.ln{fill:none;stroke:var(--mut);stroke-width:1.4;opacity:0;transition:opacity .6s}.ln.on{opacity:1}.ln.on2{opacity:.12}.ln.off{opacity:0}.ln.ac{stroke:var(--ac);stroke-width:2}.ln.dash{stroke-dasharray:4 4}
#st{position:absolute;top:22px;left:0;width:960px;text-align:center;font-size:13px;letter-spacing:.04em;color:var(--mut)}#st span{margin:0 16px;transition:color .4s}#st span.on{color:var(--ink);font-weight:600}
#ctl{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:34px;display:flex;justify-content:center;align-items:center;gap:6px;font-size:13px}
#ctl button{background:none;border:0;color:var(--mut);font:inherit;padding:6px 12px;cursor:pointer;border-radius:6px}#ctl button:hover{color:var(--ink)}
#pb{position:fixed;left:0;right:0;bottom:calc(34px + env(safe-area-inset-bottom,0px));height:10px;cursor:pointer}#pb b{position:absolute;left:0;bottom:0;height:2px;background:var(--ac);width:0}#pb u{position:absolute;bottom:0;height:2px;width:1px;background:var(--line)}
@media(prefers-reduced-motion:reduce){.e,.sc,.ln{transition-duration:.01s}}
</style></head><body>
